spring.application.name=employee-management-api
server.port=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false

spring.datasource.url=jdbc:mysql://localhost:3306/employee_management
spring.datasource.username=root
spring.datasource.password=MyNewPass@2026

# =========================
# LOGGING CONFIGURATION
# =========================

# Root application log level
logging.level.root=INFO

# Employee Management application logs
logging.level.com.example.employeemanagement=DEBUG

# Detailed logs for service layer
logging.level.com.example.employeemanagement.employee=TRACE

# Save logs in a file
logging.file.name=logs/employee-management.log

# Console log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# File log format
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n


spring.profiles.default=dev

